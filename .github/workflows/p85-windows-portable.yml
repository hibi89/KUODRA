name: KUODRA P85 Windows staged portable acceptance
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: kuodra-p85-win-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-staged-offline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and packaging dependencies
        run: python -m pip install -r requirements-ml.txt -r requirements-report.txt "scipy>=1.11,<2.0" "pyinstaller>=6.10,<7"
      - name: Independently run complete Python source tests
        run: python -m unittest discover -s tests -v
      - name: Build unsigned no-Python portable folder
        run: pyinstaller --noconfirm --clean --onedir --name KUODRA --paths . desktop/entry.py
      - name: Self test actual Windows binary and local source review
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = 'dist/KUODRA/KUODRA.exe'
          if (-not (Test-Path $binary)) { throw 'PORTABLE_EXE_MISSING' }
          $self = & $binary --self-test
          if ($LASTEXITCODE -ne 0) { throw 'PORTABLE_SELFTEST_FAILED' }
          $self | Out-File -LiteralPath "$env:RUNNER_TEMP/kuodra-selftest.json" -Encoding utf8
          python -c "import json,os; d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'kuodra-selftest.json'),encoding='utf-8-sig')); assert d['status']=='STAGED_OFFLINE_ONLY' and d['consumer_release_ready'] is False and d['trade_executed'] is False"
          $output = Join-Path $env:RUNNER_TEMP 'kuodra-p85-check'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          & $binary --offline-review --country KR --issuer-id 99998888 --as-of 2025-11-12 --source fixtures/synthetic/kr_dart.json --output-dir $output --name windows_check
          if ($LASTEXITCODE -ne 0) { throw 'PORTABLE_OFFLINE_REVIEW_FAILED' }
          & $binary --verify-export $output windows_check
          if ($LASTEXITCODE -ne 0) { throw 'PORTABLE_EVIDENCE_VERIFY_FAILED' }
          python -c "import json,os; p=os.path.join(os.environ['RUNNER_TEMP'],'kuodra-p85-check','windows_check.json'); d=json.load(open(p,encoding='utf-8')); assert d['guard']=='HOLD' and not d['trade_executed'] and not d['rights_verified']"
      - name: Staged binary remains non-release
        shell: pwsh
        run: |
          Write-Host 'STAGING_ONLY: no installer signing, no distribution, no sale, no real market data'
